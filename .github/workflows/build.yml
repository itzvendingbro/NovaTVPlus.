name: Build Nova TV+ APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # This clears the Ubuntu 26 warning

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (Bypass Wrapper)
        run: |
          # Find where the actual Android project is hiding
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts is missing. You did not upload the project files correctly."
            exit 1
          fi
          
          cd $PROJECT_DIR
          # Use system Gradle instead of the broken gradlew wrapper
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaTV-Plus-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
